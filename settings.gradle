pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Kikugie'
            url = 'https://maven.kikugie.dev/releases'
        }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.7'
}

stonecutter {
    centralScript = 'build.gradle'
    kotlinController = false

    create(rootProject) {
        versions('1.16.5', '1.17.1', '1.18.2', '1.19.2', '1.19.4', '1.20.2', '1.20.4', '1.20.6', '1.21.11')
    }
}

rootProject.name = 'CactusStonecutter'
