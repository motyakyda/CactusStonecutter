plugins {
    id 'fabric-loom' version '1.17.19'
    id 'dev.kikugie.stonecutter'
}

def mcVersion = sc.current.project

def yarnMappings = [
    '1.16.5': '1.16.5+build.10',
    '1.17.1': '1.17.1+build.65',
    '1.18.2': '1.18.2+build.4',
    '1.19.2': '1.19.2+build.28',
    '1.19.4': '1.19.4+build.2',
    '1.20.2': '1.20.2+build.4',
    '1.20.4': '1.20.4+build.3',
    '1.20.6': '1.20.6+build.3',
    '1.21.11': '1.21.11+build.6',
]

def javaRelease = [
    '1.16.5': 8,
    '1.17.1': 16,
    '1.18.2': 17,
    '1.19.2': 17,
    '1.19.4': 17,
    '1.20.2': 17,
    '1.20.4': 17,
    '1.20.6': 21,
    '1.21.11': 21,
]

version = project.mod_version + '+mc' + mcVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnMappings[mcVersion]}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease[mcVersion] > 17 ? 21 : 17)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaRelease[mcVersion]
    it.options.encoding = "UTF-8"
}
